<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IRON LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #15161A;
    --bg-elevated: #1D1F24;
    --bg-card: #24262C;
    --steel: #3A3D44;
    --steel-light: #4E525C;
    --accent: #FF4B3E;      /* iron red */
    --accent-dim: #7A2B26;
    --plate: #FFC857;       /* plate amber */
    --plate-dim: #6B5527;
    --text: #F3F2EE;
    --text-dim: #9A9CA5;
    --text-faint: #5C5F68;
    --success: #4CB782;
    --radius: 14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg); overscroll-behavior-y:none;}
  body{
    font-family:'Noto Sans KR', sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:
      radial-gradient(ellipse 600px 300px at 50% -10%, rgba(255,75,62,0.10), transparent 60%),
      var(--bg);
  }
  .num{ font-family:'JetBrains Mono', monospace; }

  /* HEADER */
  header{
    padding:22px 20px 14px;
    position:sticky; top:0; z-index:10;
    background:rgba(21,22,26,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid #26282E;
  }
  header .brand{
    font-family:'Bebas Neue', sans-serif;
    font-size:34px;
    letter-spacing:2px;
    line-height:1;
    color:var(--text);
    display:flex; align-items:baseline; gap:8px;
  }
  header .brand .dot{ color:var(--accent); }
  header .date-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:6px;
  }
  header .today-date{ color:var(--text-dim); font-size:13px; font-weight:500; }
  header .streak{
    font-size:12px; color:var(--plate); font-weight:600;
    display:flex; align-items:center; gap:4px;
  }

  main{ flex:1; padding:16px 16px calc(90px + var(--safe-bottom)); }
  .view{ display:none; }
  .view.active{ display:block; animation:fadeIn .18s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  /* SECTION LABEL */
  .section-label{
    font-size:12px; font-weight:700; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:1.5px;
    margin:20px 2px 10px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .section-label:first-child{ margin-top:0; }
  .section-label .link{
    text-transform:none; letter-spacing:0; font-size:12.5px; color:var(--accent); cursor:pointer; font-weight:700;
  }

  /* CHIP SELECTOR (body parts) */
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    padding:8px 14px;
    background:var(--bg-card);
    border:1px solid var(--steel);
    border-radius:999px;
    font-size:13px; font-weight:600; color:var(--text-dim);
    cursor:pointer; user-select:none;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#1A0C0A;
  }
  .chip.plate-style.active{ background:var(--plate); border-color:var(--plate); color:#241C05; }

  /* CARD / FORM */
  .card{
    background:var(--bg-card);
    border:1px solid #2C2E35;
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .field{ margin-bottom:12px; }
  .field label{
    display:block; font-size:11px; font-weight:700; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;
  }
  input[type=text], input[type=number], input[type=date], select{
    width:100%;
    background:var(--bg-elevated);
    border:1px solid var(--steel);
    border-radius:10px;
    padding:12px 12px;
    font-size:15px;
    color:var(--text);
    font-family:inherit;
    outline:none;
  }
  input[type=date]{ color-scheme: dark; }
  input[type=text]:focus, input[type=number]:focus, input[type=date]:focus{
    border-color:var(--accent);
  }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }
  .row3{ display:flex; gap:10px; }
  .row3 .field{ flex:1; }
  input[type=number]{ font-family:'JetBrains Mono', monospace; font-weight:700; }

  .btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:13px 16px;
    border-radius:10px;
    border:none;
    font-size:14px; font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-primary{ background:var(--accent); color:#1D0C0A; width:100%; }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-ghost{ background:transparent; border:1px solid var(--steel); color:var(--text-dim); }
  .btn-plate{ background:var(--plate); color:#241C05; }
  .btn-danger{ background:transparent; border:1px solid var(--accent-dim); color:var(--accent); }

  /* Routine quick chips in log tab */
  .routine-pick-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .routine-pick{
    flex:0 0 auto; background:var(--bg-elevated); border:1px solid var(--steel);
    border-radius:10px; padding:10px 14px; font-size:13px; font-weight:600;
    color:var(--text); cursor:pointer;
  }
  .routine-pick.active{ border-color:var(--plate); color:var(--plate); }
  .exercise-quick-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .exercise-quick{
    background:var(--bg-elevated); border:1px dashed var(--steel-light);
    border-radius:8px; padding:8px 12px; font-size:12.5px; color:var(--text-dim);
    cursor:pointer;
  }

  /* Today groups */
  .exercise-group{
    background:var(--bg-card); border:1px solid #2C2E35; border-radius:var(--radius);
    padding:14px; margin-bottom:10px;
  }
  .exercise-group-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .exercise-group-title{ font-size:15px; font-weight:700; }
  .bodypart-tag{
    font-size:10.5px; font-weight:700; color:var(--text-faint);
    background:var(--bg-elevated); padding:3px 8px; border-radius:6px;
    text-transform:uppercase; letter-spacing:0.5px; margin-left:6px;
  }
  .sets-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .plate-badge{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:70px; height:70px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #3a2a10, #1c1508 70%);
    border:3px solid var(--plate);
    box-shadow:inset 0 0 0 3px #15161A, 0 0 0 1px #000 inset;
    cursor:pointer;
  }
  .plate-badge .w{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; color:var(--plate); line-height:1; }
  .plate-badge .r{ font-size:9px; color:var(--text-dim); margin-top:2px; }
  .plate-badge .s{ font-size:8.5px; color:var(--text-faint); margin-top:1px; }

  /* History */
  .search-bar{ position:relative; margin-bottom:12px; }
  .search-bar input{ padding-left:38px; }
  .search-bar .icon{ position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:0.5; }

  .date-section{ margin-bottom:6px; }
  .date-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 4px; cursor:pointer; user-select:none;
    border-bottom:1px solid #24262C;
  }
  .date-header .left{ display:flex; flex-direction:column; }
  .date-header .name{ font-size:16px; font-weight:800; }
  .date-header .sub{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }
  .date-header .right{ display:flex; align-items:center; gap:10px; }
  .date-header .count{ font-size:12px; color:var(--text-faint); font-weight:600; }
  .date-header .chevron{ transition:transform .2s ease; color:var(--text-faint); }
  .date-header.open .chevron{ transform:rotate(90deg); }
  .date-body{ display:none; padding:10px 2px 16px; }
  .date-body.open{ display:block; }

  .history-entry{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--bg-card); border:1px solid #2C2E35; border-radius:12px;
    padding:12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .history-entry .info .ex-name{ font-weight:700; font-size:14.5px; display:flex; align-items:center; }
  .history-entry .info .ex-detail{ font-size:12px; color:var(--text-faint); margin-top:3px; }
  .history-entry .stat{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--plate); text-align:right; font-weight:700; }

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--text-faint);
  }
  .empty-state .big{ font-size:40px; margin-bottom:10px; }
  .empty-state .msg{ font-size:14px; line-height:1.6; }

  /* Routines */
  .routine-card{
    background:var(--bg-card); border:1px solid #2C2E35; border-radius:var(--radius);
    padding:16px; margin-bottom:12px;
  }
  .routine-card-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  .routine-card-head .name{ font-size:17px; font-weight:800; }
  .routine-card-head .meta{ font-size:11.5px; color:var(--text-faint); margin-top:3px; }
  .routine-ex-list{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .routine-ex-item{
    font-size:12px; background:var(--bg-elevated); padding:5px 10px; border-radius:7px; color:var(--text-dim);
  }
  .routine-card-actions{ display:flex; gap:8px; }
  .routine-card-actions .btn{ flex:1; padding:9px; font-size:12.5px; }

  .builder-ex-row{
    display:flex; gap:8px; align-items:center; margin-bottom:8px;
    background:var(--bg-elevated); padding:8px; border-radius:8px;
  }
  .builder-ex-row select{ width:auto; flex:0 0 88px; padding:8px; font-size:12px; }
  .builder-ex-row input{ flex:1; padding:8px 10px; font-size:13px; }
  .builder-ex-row .rm{ color:var(--text-faint); cursor:pointer; padding:4px 6px; font-size:16px; }

  /* Bottom nav */
  nav.bottom{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    background:rgba(21,22,26,0.96); backdrop-filter:blur(12px);
    border-top:1px solid #26282E;
    display:flex;
    padding-bottom:var(--safe-bottom);
    z-index:20;
  }
  nav.bottom button{
    flex:1; background:none; border:none; padding:12px 4px 10px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--text-faint); cursor:pointer; font-family:inherit;
  }
  nav.bottom button.active{ color:var(--accent); }
  nav.bottom button .lbl{ font-size:11px; font-weight:700; }

  /* Toast */
  #toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--text); color:#15161A; font-weight:700; font-size:13px;
    padding:10px 18px; border-radius:999px; opacity:0; transition:all .25s ease;
    pointer-events:none; z-index:50; white-space:nowrap;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  ::placeholder{ color:var(--text-faint); }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="date-row" style="margin-top:0; margin-bottom:8px;">
      <div class="brand">IRON<span class="dot">·</span>LOG</div>
      <div id="syncBtn" style="font-size:11px; font-weight:700; color:var(--text-faint); border:1px solid var(--steel); padding:6px 10px; border-radius:999px; cursor:pointer; display:flex; align-items:center; gap:4px;">
        🔗 <span id="syncBtnLabel">동기화</span>
      </div>
    </div>
    <div class="date-row">
      <div class="today-date" id="headerDate"></div>
      <div class="streak" id="headerStreak"></div>
    </div>
  </header>

  <!-- ===================== SYNC GATE (first run / device linking) ===================== -->
  <div id="syncGate" style="display:none; position:fixed; inset:0; z-index:100; background:var(--bg); padding:28px 22px; overflow-y:auto;">
    <div style="max-width:440px; margin:20px auto 0;">
      <div class="brand" style="font-size:30px; margin-bottom:6px;">IRON<span class="dot">·</span>LOG</div>
      <p style="color:var(--text-dim); font-size:14px; line-height:1.6; margin:0 0 24px;">
        기록은 <b style="color:var(--text);">동기화 코드</b>로 클라우드에 저장돼요.<br>
        같은 코드를 입력하면 다른 기기에서도 똑같은 기록을 볼 수 있어요.
      </p>

      <div class="card" style="margin-bottom:14px;">
        <div class="field" style="margin-bottom:10px;">
          <label>새로 시작하기</label>
        </div>
        <button class="btn btn-primary" id="genCodeBtn">새 동기화 코드 만들기</button>
      </div>

      <div class="section-label" style="margin:18px 2px 8px;">이미 코드가 있다면</div>
      <div class="card">
        <div class="field">
          <label>동기화 코드 입력</label>
          <input type="text" id="joinCodeInput" placeholder="예: AB12CD34" style="text-transform:uppercase;">
        </div>
        <button class="btn btn-ghost" style="width:100%;" id="joinCodeBtn">이 코드로 접속하기</button>
      </div>
      <div id="syncGateMsg" style="color:var(--accent); font-size:13px; margin-top:14px; text-align:center;"></div>
    </div>
  </div>

  <!-- ===================== SYNC INFO (view current code / switch device) ===================== -->
  <div id="syncPanel" style="display:none; position:fixed; inset:0; z-index:100; background:var(--bg); padding:28px 22px; overflow-y:auto;">
    <div style="max-width:440px; margin:20px auto 0;">
      <div class="section-label" style="margin-top:0;">내 동기화 코드</div>
      <div class="card" style="text-align:center;">
        <div class="num" id="currentCodeDisplay" style="font-size:28px; font-weight:700; color:var(--plate); letter-spacing:3px; margin-bottom:14px;"></div>
        <button class="btn btn-plate" style="width:100%;" id="copyCodeBtn">코드 복사하기</button>
      </div>
      <p style="color:var(--text-faint); font-size:12.5px; line-height:1.6; margin:14px 2px;">
        다른 기기(폰, PC 등)에서 이 코드를 입력하면 지금 보이는 기록과 루틴이 그대로 동기화돼요. 코드를 아는 사람은 누구나 데이터를 볼 수 있으니 노출되지 않게 주의하세요.
      </p>

      <div class="section-label">다른 코드로 전환</div>
      <div class="card">
        <div class="field">
          <label>동기화 코드 입력</label>
          <input type="text" id="switchCodeInput" placeholder="예: AB12CD34" style="text-transform:uppercase;">
        </div>
        <button class="btn btn-ghost" style="width:100%;" id="switchCodeBtn">이 코드로 전환하기</button>
      </div>
      <button class="btn btn-ghost" style="width:100%; margin-top:16px;" id="closeSyncPanelBtn">닫기</button>
    </div>
  </div>

  <main>
    <!-- ===================== LOG VIEW ===================== -->
    <section class="view active" id="view-log">

      <div class="section-label">루틴 불러오기</div>
      <div id="routinePickRow" class="routine-pick-row"></div>
      <div id="routineExerciseList" class="exercise-quick-list"></div>

      <div class="section-label">세트 기록하기</div>
      <div class="card">
        <div class="field">
          <label>날짜</label>
          <input type="date" id="dateInput">
        </div>
        <div class="field">
          <label>부위</label>
          <div class="chip-row" id="logBodyPartChips"></div>
        </div>
        <div class="field">
          <label>운동명</label>
          <input type="text" id="exerciseInput" placeholder="예: 벤치프레스" list="exerciseSuggestions">
          <datalist id="exerciseSuggestions"></datalist>
        </div>
        <div class="row3">
          <div class="field">
            <label>무게 (kg)</label>
            <input type="number" id="weightInput" placeholder="60" inputmode="decimal">
          </div>
          <div class="field">
            <label>횟수</label>
            <input type="number" id="repsInput" placeholder="10" inputmode="numeric">
          </div>
          <div class="field">
            <label>세트수</label>
            <input type="number" id="setsInput" placeholder="3" inputmode="numeric" value="1">
          </div>
        </div>
        <button class="btn btn-primary" id="addSetBtn">+ 기록 추가</button>
      </div>

      <div class="section-label"><span id="logListTitle">오늘 기록</span> (<span id="todayCount">0</span>)</div>
      <div id="todayList"></div>
    </section>

    <!-- ===================== HISTORY VIEW ===================== -->
    <section class="view" id="view-history">
      <div class="search-bar">
        <span class="icon">🔍</span>
        <input type="text" id="searchInput" placeholder="운동명으로 검색">
      </div>
      <div class="chip-row" id="historyBodyPartFilter" style="margin-bottom:14px;"></div>
      <div id="historyList"></div>
    </section>

    <!-- ===================== ROUTINE VIEW ===================== -->
    <section class="view" id="view-routine">
      <button class="btn btn-plate" style="width:100%; margin-bottom:16px;" id="newRoutineBtn">+ 새 루틴 만들기</button>
      <div id="routineList"></div>
    </section>

    <!-- ===================== ROUTINE BUILDER ===================== -->
    <section class="view" id="view-builder">
      <div class="section-label">루틴 이름</div>
      <div class="card" style="margin-bottom:16px;">
        <input type="text" id="builderNameInput" placeholder="예: 가슴/삼두 루틴">
      </div>
      <div class="section-label">운동 목록</div>
      <div id="builderExRows"></div>
      <button class="btn btn-ghost" style="width:100%; margin:10px 0 20px;" id="builderAddRowBtn">+ 운동 추가</button>
      <button class="btn btn-primary" id="builderSaveBtn">루틴 저장</button>
      <button class="btn btn-ghost" style="width:100%; margin-top:10px;" id="builderCancelBtn">취소</button>
    </section>

    <!-- ===================== ENTRY EDIT VIEW ===================== -->
    <section class="view" id="view-edit">
      <div class="section-label">기록 수정</div>
      <div class="card">
        <div class="field">
          <label>날짜</label>
          <input type="date" id="editDateInput">
        </div>
        <div class="field">
          <label>부위</label>
          <div class="chip-row" id="editBodyPartChips"></div>
        </div>
        <div class="field">
          <label>운동명</label>
          <input type="text" id="editExerciseInput" placeholder="운동명">
        </div>
        <div class="row3">
          <div class="field">
            <label>무게 (kg)</label>
            <input type="number" id="editWeightInput">
          </div>
          <div class="field">
            <label>횟수</label>
            <input type="number" id="editRepsInput">
          </div>
          <div class="field">
            <label>세트수</label>
            <input type="number" id="editSetsInput">
          </div>
        </div>
      </div>
      <button class="btn btn-primary" id="editSaveBtn">저장</button>
      <button class="btn btn-danger" style="width:100%; margin-top:10px;" id="editDeleteBtn">이 기록 삭제</button>
      <button class="btn btn-ghost" style="width:100%; margin-top:10px;" id="editCancelBtn">취소</button>
    </section>
  </main>

  <nav class="bottom">
    <button class="nav-btn active" data-view="log">
      <span>🏋️</span><span class="lbl">기록</span>
    </button>
    <button class="nav-btn" data-view="history">
      <span>📖</span><span class="lbl">히스토리</span>
    </button>
    <button class="nav-btn" data-view="routine">
      <span>⭐</span><span class="lbl">루틴</span>
    </button>
  </nav>

  <div id="toast"></div>
</div>

<script type="module">
/* =====================================================================
   Firebase 설정
   1) https://console.firebase.google.com 에서 프로젝트를 만드세요.
   2) Build > Firestore Database > 데이터베이스 만들기 (테스트 모드로 시작)
   3) 프로젝트 설정(톱니바퀴) > 일반 > 내 앱 > 웹 앱 추가(</>) 후
      아래 나오는 firebaseConfig 값을 그대로 복사해서 아래에 붙여넣으세요.
   ===================================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDateKo(dstr){
  const [y,m,d] = dstr.split('-');
  const days = ['일','월','화','수','목','금','토'];
  const dateObj = new Date(Number(y), Number(m)-1, Number(d));
  return `${parseInt(m)}월 ${parseInt(d)}일 (${days[dateObj.getDay()]})`;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ---------------- SYNC CODE + STORAGE (Firestore) ---------------- */
let syncCode = localStorage.getItem('ironlog_sync_code') || '';

function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 헷갈리는 문자 제외
  let s = '';
  for(let i=0;i<8;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function dataRef(code){ return doc(db, 'workoutApps', code); }

async function loadData(){
  try{
    const snap = await getDoc(dataRef(syncCode));
    if(snap.exists()){
      const d = snap.data();
      logs = d.logs || [];
      routines = d.routines || [];
    } else {
      logs = []; routines = [];
      await setDoc(dataRef(syncCode), { logs: [], routines: [], updatedAt: Date.now() });
    }
    logs.forEach(l=>{ if(l.sets===undefined) l.sets = 1; });
  }catch(e){
    console.error(e);
    showToast('불러오기 실패 - 인터넷 연결 또는 Firebase 설정을 확인하세요');
    logs = []; routines = [];
  }
}
async function saveData(){
  try{
    await setDoc(dataRef(syncCode), { logs, routines, updatedAt: Date.now() }, { merge: true });
  }catch(e){
    console.error(e);
    showToast('저장 실패 - 인터넷 연결을 확인해주세요');
  }
}
// 이전 코드와의 호환을 위해 saveLogs/saveRoutines 이름을 그대로 유지
async function saveLogs(){ await saveData(); }
async function saveRoutines(){ await saveData(); }

/* ---------------- HEADER ---------------- */
function renderHeader(){
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('headerDate').textContent =
    `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;

  const dateSet = new Set(logs.map(l=>l.date));
  let streak = 0;
  let cur = new Date();
  if(!dateSet.has(todayStr())){
    cur.setDate(cur.getDate()-1);
  }
  while(true){
    const ds = cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
    if(dateSet.has(ds)){ streak++; cur.setDate(cur.getDate()-1); }
    else break;
  }
  document.getElementById('headerStreak').textContent = streak>0 ? `🔥 ${streak}일 연속` : '';
}

function switchView(name){
  state.currentView = name;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===name);
  });
  if(name==='history') renderHistory();
  if(name==='routine') renderRoutineList();
}

function renderTodayList(){
  const sel = state.selectedDate;
  const isToday = sel === todayStr();
  document.getElementById('logListTitle').textContent = isToday ? '오늘 기록' : `${fmtDateKo(sel)} 기록`;

  const dayLogs = logs.filter(l=>l.date===sel);
  document.getElementById('todayCount').textContent = dayLogs.length;
  const wrap = document.getElementById('todayList');
  wrap.innerHTML = '';
  if(dayLogs.length===0){
    wrap.innerHTML = `<div class="empty-state"><div class="big">🏋️</div><div class="msg">${isToday? '아직 오늘 기록이 없어요.' : '이 날짜의 기록이 없어요.'}<br>위에서 기록을 추가해보세요.</div></div>`;
    return;
  }
  // group by exercise, preserve order of first appearance
  const groups = [];
  const map = {};
  dayLogs.forEach(l=>{
    if(!map[l.exercise]){
      map[l.exercise] = { exercise:l.exercise, bodyPart:l.bodyPart, entries:[] };
      groups.push(map[l.exercise]);
    }
    map[l.exercise].entries.push(l);
  });
  groups.forEach(g=>{
    const gDiv = document.createElement('div');
    gDiv.className = 'exercise-group';
    gDiv.innerHTML = `
      <div class="exercise-group-head">
        <div class="exercise-group-title">${escapeHtml(g.exercise)}<span class="bodypart-tag">${g.bodyPart}</span></div>
      </div>
      <div class="sets-row">
        ${g.entries.map(s=>`
          <div class="plate-badge" data-id="${s.id}">
            <div class="w">${s.weight}</div>
            <div class="r">×${s.reps}</div>
            <div class="s">${s.sets}세트</div>
          </div>
        `).join('')}
      </div>
    `;
    wrap.appendChild(gDiv);
  });
  wrap.querySelectorAll('.plate-badge').forEach(el=>{
    el.addEventListener('click', ()=> openEdit(el.dataset.id));
  });
}

/* ---------------- HISTORY VIEW (grouped by date) ---------------- */
function renderHistoryFilterChips(){
  const wrap = document.getElementById('historyBodyPartFilter');
  wrap.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip plate-style' + (state.historyBodyPartFilter==='all' ? ' active':'');
  allChip.textContent = '전체';
  allChip.addEventListener('click', ()=>{ state.historyBodyPartFilter='all'; renderHistory(); });
  wrap.appendChild(allChip);
  BODY_PARTS.forEach(bp=>{
    const chip = document.createElement('div');
    chip.className = 'chip plate-style' + (state.historyBodyPartFilter===bp ? ' active':'');
    chip.textContent = bp;
    chip.addEventListener('click', ()=>{ state.historyBodyPartFilter=bp; renderHistory(); });
    wrap.appendChild(chip);
  });
}

let openDates = new Set(); // dates currently expanded; most recent auto-opened on first render
let historyInitialized = false;

function renderHistory(){
  renderHistoryFilterChips();
  const listWrap = document.getElementById('historyList');
  listWrap.innerHTML = '';

  const q = state.searchQuery.trim().toLowerCase();
  let filtered = logs.filter(l=>{
    if(state.historyBodyPartFilter!=='all' && l.bodyPart!==state.historyBodyPartFilter) return false;
    if(q && !l.exercise.toLowerCase().includes(q)) return false;
    return true;
  });

  if(filtered.length===0){
    listWrap.innerHTML = `<div class="empty-state"><div class="big">📖</div><div class="msg">조건에 맞는 기록이 없어요.</div></div>`;
    return;
  }

  const byDate = {};
  filtered.forEach(l=>{
    if(!byDate[l.date]) byDate[l.date] = [];
    byDate[l.date].push(l);
  });
  const dates = Object.keys(byDate).sort((a,b)=> b.localeCompare(a));

  if(!historyInitialized && dates.length>0){
    openDates.add(dates[0]);
    historyInitialized = true;
  }

  dates.forEach(date=>{
    const entries = byDate[date];
    const isOpen = openDates.has(date);
    const totalSets = entries.reduce((sum,e)=>sum+e.sets,0);
    const exerciseCount = new Set(entries.map(e=>e.exercise)).size;

    const section = document.createElement('div');
    section.className = 'date-section';

    const header = document.createElement('div');
    header.className = 'date-header' + (isOpen?' open':'');
    header.innerHTML = `
      <div class="left">
        <span class="name">${fmtDateKo(date)}</span>
        <span class="sub">운동 ${exerciseCount}개 · ${totalSets}세트</span>
      </div>
      <div class="right"><span class="chevron">›</span></div>
    `;
    header.addEventListener('click', ()=>{
      if(openDates.has(date)) openDates.delete(date); else openDates.add(date);
      renderHistory();
    });
    section.appendChild(header);

    const body = document.createElement('div');
    body.className = 'date-body' + (isOpen?' open':'');

    entries.forEach(l=>{
      const row = document.createElement('div');
      row.className = 'history-entry';
      row.innerHTML = `
        <div class="info">
          <div class="ex-name">${escapeHtml(l.exercise)}<span class="bodypart-tag">${l.bodyPart}</span></div>
          <div class="ex-detail">${l.sets}세트 · ${l.reps}회</div>
        </div>
        <div class="stat">${l.weight}kg</div>
      `;
      row.addEventListener('click', ()=> openEdit(l.id));
      body.appendChild(row);
    });

    section.appendChild(body);
    listWrap.appendChild(section);
  });
}

document.getElementById('searchInput').addEventListener('input', (e)=>{

  renderHistory();
});

document.getElementById('builderCancelBtn').addEventListener('click', ()=>{
  switchView('routine');
});

function openBuilder(routineId){
  state.editingRoutineId = routineId;
  const existing = routineId ? routines.find(r=>r.id===routineId) : null;
  document.getElementById('builderNameInput').value = existing ? existing.name : '';
  state.builderExercises = existing ? JSON.parse(JSON.stringify(existing.exercises)) : [{bodyPart:BODY_PARTS[0], exercise:''}];
  renderBuilderRows();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-builder').classList.add('active');
}

function renderBuilderRows(){
  const wrap = document.getElementById('builderExRows');
  wrap.innerHTML = '';
  state.builderExercises.forEach((ex, idx)=>{
    const row = document.createElement('div');
    row.className = 'builder-ex-row';
    const options = BODY_PARTS.map(bp=>`<option value="${bp}" ${bp===ex.bodyPart?'selected':''}>${bp}</option>`).join('');
    row.innerHTML = `
      <select data-idx="${idx}" class="b-part">${options}</select>
      <input type="text" data-idx="${idx}" class="b-name" placeholder="운동명" value="${escapeHtml(ex.exercise)}">
      <div class="rm" data-idx="${idx}">✕</div>
    `;
    wrap.appendChild(row);
  });
  wrap.querySelectorAll('.b-part').forEach(el=>{
    el.addEventListener('change', ()=>{ state.builderExercises[el.dataset.idx].bodyPart = el.value; });
  });
  wrap.querySelectorAll('.b-name').forEach(el=>{
    el.addEventListener('input', ()=>{ state.builderExercises[el.dataset.idx].exercise = el.value; });
  });
  wrap.querySelectorAll('.rm').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.builderExercises.splice(el.dataset.idx,1);
      if(state.builderExercises.length===0) state.builderExercises.push({bodyPart:BODY_PARTS[0], exercise:''});
      renderBuilderRows();
    });
  });
}

document.getElementById('builderAddRowBtn').addEventListener('click', ()=>{
  state.builderExercises.push({bodyPart:BODY_PARTS[0], exercise:''});
  renderBuilderRows();
});

document.getElementById('builderSaveBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('builderNameInput').value.trim();
  const exs = state.builderExercises.filter(e=>e.exercise.trim()!=='');
  if(!name){ showToast('루틴 이름을 입력해주세요'); return; }
  if(exs.length===0){ showToast('운동을 하나 이상 추가해주세요'); return; }
  if(state.editingRoutineId){
    const r = routines.find(r=>r.id===state.editingRoutineId);
    r.name = name; r.exercises = exs;
  } else {
    routines.push({ id: uid(), name, exercises: exs });
  }
  await saveRoutines();
  showToast('루틴이 저장됐어요');
  switchView('routine');
});

/* ---------------- HELPERS ---------------- */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderAll(){
  renderHeader();
  renderLogBodyPartChips();
  renderRoutinePickRow();
  renderExerciseSuggestions();
  renderTodayList();
  if(state.currentView==='history') renderHistory();
  if(state.currentView==='routine') renderRoutineList();
}

/* ---------------- INIT ---------------- */
async function startApp(){
  updateSyncBtnLabel();
  document.getElementById('dateInput').value = state.selectedDate;
  await loadData();
  renderAll();
}

(function init(){
  if(!syncCode){
    showSyncGate();
  } else {
    startApp();
  }
})();
</script>
</body>
